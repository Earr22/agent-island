name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build native application
        shell: pwsh
        run: .\native\build.ps1 -OutputDirectory artifacts/ci-native
      - name: Native self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/ci-native/AgentIsland.Native.exe -ArgumentList '--self-test', '--output=artifacts/ci-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Native self-test failed.' }
          $report = Get-Content artifacts/ci-test/native-self-test.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Native self-test report failed.' }
          Write-Output "Native checks passed: $($report.checks)"
      - name: Isolated permission-card UI regression
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/ci-native/AgentIsland.Native.exe -ArgumentList '--render-showcase', '--output=artifacts/ci-showcase' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Showcase UI regression failed.' }
          $report = Get-Content artifacts/ci-showcase/showcase-manifest.json -Raw | ConvertFrom-Json
          if (-not $report.decisionCardRendered -or -not $report.decisionAnswered -or $report.frameCount -ne 180) { throw 'Permission-card regression report failed.' }
          if (-not $report.bilingualCaptions -or ($report.captionLanguages -join ',') -ne 'zh-CN,en') { throw 'Bilingual showcase caption check failed.' }
          foreach ($field in @('desktopCaptured', 'sessionMonitoring', 'clipboardRead', 'windowsNotificationsRead', 'httpListenerStarted')) {
            if ($report.$field) { throw "Showcase isolation failed: $field" }
          }
      - name: Isolated drag and edge-snap UI regression
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/ci-native/AgentIsland.Native.exe -ArgumentList '--diagnose', '--output=artifacts/ci-drag-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Drag UI regression failed.' }
          $report = Get-Content artifacts/ci-drag-test/native-performance.json -Raw | ConvertFrom-Json
          $required = @('compact-blank-area-draggable', 'hover-blank-area-draggable', 'drag-threshold-preserves-click', 'armed-drag-blocks-hover-transition', 'drag-moves-window-in-dips', 'capture-loss-persists-free-position', 'snap-prompt-balanced-layout', 'workspace-top-grip-draggable')
          foreach ($name in $required) {
            if (-not ($report.uiChecks | Where-Object { $_.name -eq $name -and $_.passed })) { throw "Missing or failed UI check: $name" }
          }
          if (@($report.uiChecks).Count -lt 28 -or @($report.uiChecks | Where-Object { -not $_.passed }).Count) { throw 'UI regression checks failed.' }
          if (@($report.placements).Count -ne 4 -or @($report.placements | Where-Object { -not $_.visibleInsideCanvas -or -not $_.visibleInsideScreen }).Count) { throw 'Edge placement checks failed.' }
          Write-Output "UI checks passed: $(@($report.uiChecks).Count)"
  legacy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
