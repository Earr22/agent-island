name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify version and build both packages
        shell: pwsh
        run: |
          [xml]$project = Get-Content native/AgentIsland.Native.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag and native version differ.' }
          .\native\build.ps1 -OutputDirectory artifacts/release-framework-dependent
          .\native\build.ps1 -SelfContained -OutputDirectory artifacts/release-self-contained
      - name: Test both packages
        shell: pwsh
        run: |
          foreach ($flavor in @('framework-dependent', 'self-contained')) {
            $process = Start-Process -FilePath "artifacts/release-$flavor/AgentIsland.Native.exe" -ArgumentList '--self-test', "--output=artifacts/test-$flavor" -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Self-test failed: $flavor" }
            $report = Get-Content "artifacts/test-$flavor/native-self-test.json" -Raw | ConvertFrom-Json
            if (-not $report.ok) { throw "Self-test report failed: $flavor" }
            $process = Start-Process -FilePath "artifacts/release-$flavor/AgentIsland.Native.exe" -ArgumentList '--render-showcase', "--output=artifacts/ui-test-$flavor" -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Permission-card UI regression failed: $flavor" }
            $ui = Get-Content "artifacts/ui-test-$flavor/showcase-manifest.json" -Raw | ConvertFrom-Json
            if (-not $ui.decisionCardRendered -or -not $ui.decisionAnswered -or $ui.httpListenerStarted) { throw "Permission-card UI report failed: $flavor" }
            $process = Start-Process -FilePath "artifacts/release-$flavor/AgentIsland.Native.exe" -ArgumentList '--diagnose', "--output=artifacts/drag-test-$flavor" -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Drag UI regression failed: $flavor" }
            $drag = Get-Content "artifacts/drag-test-$flavor/native-performance.json" -Raw | ConvertFrom-Json
            $required = @('compact-blank-area-draggable', 'hover-blank-area-draggable', 'drag-threshold-preserves-click', 'armed-drag-blocks-hover-transition', 'drag-moves-window-in-dips', 'capture-loss-persists-free-position', 'snap-prompt-balanced-layout', 'workspace-top-grip-draggable')
            foreach ($name in $required) {
              if (-not ($drag.uiChecks | Where-Object { $_.name -eq $name -and $_.passed })) { throw "Missing or failed UI check: $flavor / $name" }
            }
            if (@($drag.uiChecks).Count -lt 28 -or @($drag.uiChecks | Where-Object { -not $_.passed }).Count) { throw "UI regression checks failed: $flavor" }
            if (@($drag.placements).Count -ne 4 -or @($drag.placements | Where-Object { -not $_.visibleInsideCanvas -or -not $_.visibleInsideScreen }).Count) { throw "Edge placement checks failed: $flavor" }
          }
      - name: Package and generate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $version = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($flavor in @('framework-dependent', 'self-contained')) {
            $folder = "artifacts/release-$flavor"
            Copy-Item -LiteralPath LICENSE, THIRD_PARTY_NOTICES.md, README.zh-CN.md, PRIVACY.md -Destination $folder
            $artifact = "release/Agent-Island-Native-$version-win-x64-$flavor.zip"
            Compress-Archive -Path "$folder/*" -DestinationPath $artifact
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($artifact))" | Set-Content -LiteralPath "$artifact.sha256" -Encoding ascii
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes are required.' }
          $assets = @(Get-ChildItem -LiteralPath release -File | Select-Object -ExpandProperty FullName)
          gh release create $tag @assets --title "Agent Island $tag" --notes-file $notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
