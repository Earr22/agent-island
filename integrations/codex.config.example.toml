# Replace PROJECT_PATH with the absolute path to this project.
# Codex runs the notify command with one JSON argument when a turn completes.
notify = [
  "powershell.exe",
  "-NoProfile",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "PROJECT_PATH\\scripts\\codex-bridge.ps1"
]

[tui]
# Codex's own terminal notifications still cover approval requests.
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "always"
